name: Autonomous Knowledge Ingestion

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Category filter (optional: ai, backend, devops, security, system-design, databases)"
        required: false
        default: ""
      source:
        description: "Source filter (optional: manual, github, hackernews, all)"
        required: false
        default: "all"

jobs:
  ingest-and-publish:
    name: Discover & Publish Knowledge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s backend/tests

      - name: Run Autonomous Ingestion Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'mock' }}
        run: |
          ARG_CATEGORY="${{ github.event.inputs.category }}"
          ARG_SOURCE="${{ github.event.inputs.source || 'all' }}"
          
          CMD="python backend/scripts/run.py --source $ARG_SOURCE"
          if [ -n "$ARG_CATEGORY" ]; then
            CMD="$CMD --category $ARG_CATEGORY"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push Changes
        run: |
          git config --global user.name "almanac-bot[bot]"
          git config --global user.email "almanac-bot[bot]@users.noreply.github.com"
          
          git add knowledge/ shared/
          if git diff --staged --quiet; then
            echo "No new knowledge generated to commit."
          else
            git commit -m "docs(autonomous): publish daily AI-generated engineering knowledge"
            git push origin main
          fi
